<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据源与表目录 · 中国司法统计史料</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .cat-head .sub{opacity:.92}
  .backlink{display:inline-block;margin:10px 0 0;color:#fff;text-decoration:underline;font-size:12.5px;opacity:.9}
  .backlink:hover{opacity:1}
  /* 顶部筛选条 */
  .toolbar{position:sticky;top:0;z-index:20;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .toolbar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .toolbar label{font-size:12px;color:var(--ink2)}
  .stat-pill{font-size:12px;color:var(--ink2);background:var(--soft);border-radius:14px;padding:3px 11px}
  /* 双栏布局 */
  .cat-layout{display:flex;gap:14px;align-items:flex-start}
  .rail{flex:none;width:230px;max-height:72vh;overflow:auto;position:sticky;top:78px;
    border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px}
  .rail h3{margin:4px 6px 8px;font-size:13px;color:var(--accent)}
  .rail-item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:12.5px}
  .rail-item:hover{background:var(--soft)}
  .rail-item.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rail-item.on .rc{color:#fff}
  .rail-item .rn{font-weight:600}
  .rail-item .rc{font-size:11px;color:var(--ink2);margin-top:2px}
  .rail-item .rc b{color:#a12828}
  .rail-item.on .rc b{color:#ffd9d9}
  .main{flex:1;min-width:0}
  /* 表卡片 */
  .tcard{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;overflow:hidden}
  .tcard > summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .tcard > summary::-webkit-details-marker{display:none}
  .tcard[open] > summary{border-bottom:1px solid var(--line);background:var(--soft)}
  .tcard .tt{flex:1;min-width:240px;font-weight:600;font-size:13.5px;color:var(--ink)}
  .tcard .tt small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px;margin-top:2px}
  .tcard .meta{font-size:11.5px;color:var(--ink2);margin-top:3px}
  .badges-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ab{font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
  .ab-court{background:#eaf6ec;color:#2c6b3a}
  .ab-orphan{background:#fdecec;color:#a12828}
  .ab-ag{background:var(--soft);color:var(--accent)}
  .ab-ano{background:#fff6e0;color:#8a6100}
  .ab-ano.has-high{background:#fdecec;color:#a12828}
  .ab-q{background:#e8f1fa;color:#1F4E79}
  .body{padding:12px 14px}
  .grid-wrap{overflow:auto;max-height:460px;border:1px solid var(--line);border-radius:8px;margin-top:8px}
  table.grid{border-collapse:collapse;width:100%;font-size:12px}
  table.grid th,table.grid td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;text-align:left}
  table.grid thead tr{background:var(--soft);color:var(--accent);font-weight:600;position:sticky;top:0}
  table.grid td.empty{color:#b9c0c8}
  table.grid tr.hl td{background:#fff8ec}
  .ano-list{margin:8px 0 0;padding:0;list-style:none}
  .ano-list li{font-size:12px;color:var(--ink2);padding:5px 9px;border-radius:6px;margin-bottom:5px;border-left:3px solid #ddd}
  .ano-list li.sev-warn{border-left-color:#e0a800;background:#fffdf5}
  .ano-list li.sev-info{border-left-color:#9aa3ad;background:#fafbfc}
  .ano-list li.sev-high{border-left-color:#a12828;background:#fdf2f2}
  .src-path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink2);
    background:var(--soft);padding:2px 7px;border-radius:5px;display:inline-block;margin-top:4px}
  .empty-state{padding:40px;text-align:center;color:var(--ink2)}
  .jump-link{font-size:11.5px;color:var(--accent);text-decoration:none}
  .jump-link:hover{text-decoration:underline}
  @media (max-width:820px){.cat-layout{flex-direction:column}.rail{width:100%;position:static;max-height:none}}
</style>
</head>
<body>
<header class="site-head cat-head">
  <div class="wrap">
    <h1>数据源与表目录</h1>
    <p class="sub">从导入的 Markdown 源文件直接抽取的全部统计表（共 <span id="tot-tables">…</span> 张），逐一重建为二维网格，可溯源至原书页码/行号，异常处均已明显标记。</p>
    <a class="backlink" href="index.html">← 返回数据检索与图表主站</a>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <div class="stat-pill" id="pill-total">…</div>
    <div class="grp">
      <label>搜索</label>
      <input type="search" id="q" placeholder="表标题 / 类别 / 机关 / 行号">
    </div>
    <div class="grp" id="agency-chips"></div>
    <div class="grp">
      <label>范围</label>
      <select id="scope">
        <option value="">全部</option>
        <option value="court">仅法院数据集</option>
        <option value="orphan">仅未纳入（非法院/待核）</option>
      </select>
    </div>
    <div class="grp">
      <label>异常</label>
      <select id="ano">
        <option value="">不限</option>
        <option value="warn">含警告级异常</option>
        <option value="info">仅提示级</option>
        <option value="none">无异常</option>
      </select>
    </div>
    <div class="stat-pill" id="pill-show">显示 0</div>
  </div>

  <div class="cat-layout">
    <nav class="rail" id="rail">
      <h3>来源文件（点击切换）</h3>
      <div id="rail-items"></div>
    </nav>
    <section class="main">
      <div id="cards"></div>
      <div class="empty-state" id="empty" style="display:none">无匹配表格</div>
    </section>
  </div>
</main>

<footer class="wrap foot">
  <p>本目录由源文件 Markdown 直接抽取重建，与法院数据集 inventory 对账。灰色/红色徽标为异常标记，请逐条核对。原始数据以原书为准。</p>
</footer>

<script src="assets/catalog.js"></script>
</body>
</html>
